name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.5)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Update PackageVersion in csproj
        run: |
          sed -i -E "s|<PackageVersion>[^<]+</PackageVersion>|<PackageVersion>${{ inputs.version }}</PackageVersion>|" src/GummyCat/GummyCat.csproj
          grep -q "<PackageVersion>${{ inputs.version }}</PackageVersion>" src/GummyCat/GummyCat.csproj

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/GummyCat/GummyCat.csproj
          git commit -m "Release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD
          git push origin "v${{ inputs.version }}"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Pack
        run: dotnet pack src/GummyCat/GummyCat.csproj --no-build -c Release -o artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          files: artifacts/*.nupkg
          generate_release_notes: true
